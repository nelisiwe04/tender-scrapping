name: Build and Push PostgreSQL to GHCR

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build PostgreSQL image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/postgres-db:latest .

      - name: Push PostgreSQL image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/postgres-db:latest