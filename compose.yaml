services:
  postgres:
    image: ghcr.io/nelisiwe04/tender-scrapping:latest
    container_name: postgres-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: tender_scrapping_agent
      POSTGRES_PASSWORD: tender@scrapping
      POSTGRES_DB: tender_scrapping_db

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:9.8
    container_name: pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tender.com
      PGADMIN_DEFAULT_PASSWORD: secret

    ports:
      - "5050:80"

    depends_on:
      - postgres

    configs:
      - source: pgadmin-pgpass
        target: /config/pgpass
        uid: "5050"
        gid: "5050"
        mode: 0400

      - source: pgadmin-servers
        target: /pgadmin4/servers.json
        mode: 0444

volumes:
  postgres_data:

configs:
  pgadmin-servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "Tender Scrapping Server",
            "Group": "Servers",
            "Host": "postgres",
            "Port": 5432,
            "MaintenanceDB": "tender_scrapping_db",
            "Username": "tender_scrapping_agent",
            "PassFile": "/config/pgpass"
          }
        }
      }

