services:
  postgres:
    image: ghcr.io/nelisiwe04/tender-scrapping:latest
    container_name: postgres-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: tender_scrapping_agent
      POSTGRES_PASSWORD: tender@scrapping
      POSTGRES_DB: tender_scrapping_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:9.8
    container_name: pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tender.com
      PGADMIN_DEFAULT_PASSWORD: secret

    ports:
      - "5050:80"

    depends_on:
      - postgres

volumes:
  postgres_data:
